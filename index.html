<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Uni CSE - Lecture Alerts & Campus Navigator</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="description" content="Uni Vadodara CSE Sem-V official lecture alert and campus location finder app.">
  <meta name="theme-color" content="#090D16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Uni CSE">
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app-root">
    <!-- Top Header Bar -->
    <header class="top-header">
      <div class="brand-group">
        <img src="logo.png" alt="Uni Logo" class="brand-logo">
        <div>
          <div class="brand-title">Uni CSE</div>
          <div class="brand-subtitle" id="header-batch-subtitle">Batch A Timetable & Alerts</div>
        </div>
      </div>

      <!-- Desktop Nav Tabs -->
      <nav class="desktop-nav">
        <button class="nav-btn active" data-tab="dashboard">Dashboard</button>
        <button class="nav-btn" data-tab="schedule">Schedule</button>
        <button class="nav-btn" data-tab="map">Campus Map</button>
      </nav>

      <!-- Batch Dropdown Selector -->
      <div class="header-batch-selector" style="margin-left: auto;">
        <select id="app-batch-select" class="form-control" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: white; border-radius: 8px; padding: 0.35rem 0.6rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; outline: none; transition: all 0.2s;">
          <option value="Batch A" style="background: #0d1222; color: white;">Batch A</option>
          <option value="Batch B" style="background: #0d1222; color: white;">Batch B</option>
          <option value="Batch C" style="background: #0d1222; color: white;">Batch C</option>
        </select>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
      


      <!-- TAB 1: DASHBOARD -->
      <section id="tab-dashboard" class="tab-panel active">
        <div id="hero-next-lecture-card" class="glass-card next-lecture-card">
          <!-- Rendered dynamically -->
        </div>

        <div class="glass-card">
          <div class="glass-card-header">
            <div class="card-title-group">
              <div class="card-icon" style="background: rgba(16, 185, 129, 0.15); color: var(--accent-emerald);">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              </div>
              <div>
                <h3 style="font-size: 1.05rem;">Today's Uni Agenda</h3>
                <p class="brand-subtitle">Batch A classes & labs</p>
              </div>
            </div>
            <button class="btn-primary" id="open-add-modal-btn">
              + Add Class
            </button>
          </div>

          <div id="dash-today-schedule-container">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </section>

      <!-- TAB 2: SCHEDULE MANAGER -->
      <section id="tab-schedule" class="tab-panel">
        <div class="glass-card">
          <div class="glass-card-header">
            <div>
              <h2 style="font-size: 1.2rem;">Uni Weekly Timetable</h2>
              <p class="brand-subtitle">Semester-V Computer Science (Batch A)</p>
            </div>
            <button class="btn-primary" onclick="document.getElementById('open-add-modal-btn').click()">
              + Add Class
            </button>
          </div>

          <div id="day-filter-bar" style="display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1rem;">
            <!-- Rendered dynamically -->
          </div>

          <div id="schedule-list-container">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </section>

      <!-- TAB 3: CAMPUS MAP -->
      <section id="tab-map" class="tab-panel">
        <div id="campus-map-container">
          <!-- Rendered dynamically -->
        </div>
      </section>

    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
      <button class="mob-nav-item active" data-tab="dashboard" style="width: 33%;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Home</span>
      </button>
      <button class="mob-nav-item" data-tab="schedule" style="width: 33%;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Classes</span>
      </button>
      <button class="mob-nav-item" data-tab="map" style="width: 33%;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
        <span>Map</span>
      </button>
    </nav>
  </div>

  <!-- Modal: Add New Lecture -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="color: white;">Add New Lecture</h3>
        <button class="modal-close-btn" id="close-modal-btn">✕</button>
      </div>

      <form id="add-lecture-form">
        <div class="form-group">
          <label>Course / Subject Name *</label>
          <input type="text" id="form-subject" class="form-control" placeholder="e.g. Design & Analysis of Algorithms" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Course Code</label>
            <input type="text" id="form-code" class="form-control" placeholder="e.g. DAA">
          </div>
          <div class="form-group">
            <label>Professor</label>
            <input type="text" id="form-prof" class="form-control" placeholder="e.g. Ms. Nisha Parmar">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Day of Week *</label>
            <select id="form-day" class="form-control" required>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday" selected>Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>
          </div>
          <div class="form-group">
            <label>Start Time *</label>
            <input type="time" id="form-start" class="form-control" value="11:30" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>End Time *</label>
            <input type="time" id="form-end" class="form-control" value="12:25" required>
          </div>
          <div class="form-group">
            <label>Room Number *</label>
            <input type="text" id="form-room" class="form-control" placeholder="e.g. J002" required>
          </div>
        </div>

        <div class="form-group">
          <label>Campus Building *</label>
          <select id="form-building" class="form-control" required>
          </select>
        </div>

        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem;">
          <button type="button" class="btn-secondary" onclick="document.getElementById('modal-backdrop').classList.remove('active')">Cancel</button>
          <button type="submit" class="btn-primary">Save Lecture</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
